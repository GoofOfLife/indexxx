<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0c0f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Скоростемер</title>
<link rel="icon" href="data:,">
<style>
:root{--bg:#0a0c0f;--panel:#12161b;--panel2:#1a2027;--line:#28303a;--tx:#e8edf3;--mut:#8a95a3;--acc:#4aa3ff;--ok:#35d07f;--warn:#ffd23f;--bad:#ff5a5f;--gate:#3de6d1;--lane:#ffab4d;--r:14px}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);overflow:hidden}
body{font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-text-size-adjust:100%;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#hdr{display:flex;align-items:center;gap:10px;padding:6px 12px;min-height:54px;background:var(--panel);border-bottom:1px solid var(--line)}
.ttl{display:flex;flex-direction:column;line-height:1.15;min-width:0}
#stepNum{font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#stepName{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#dots{display:flex;gap:6px;margin-left:auto}
#dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
#dots i.on{background:var(--acc);box-shadow:0 0 0 3px rgba(74,163,255,.25)}
#dots i.done{background:#3a6f9c}
.icon{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:21px;flex:none}
#stage{position:relative;overflow:hidden;background:#000;min-height:0;touch-action:none}
#video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.fitbtn{position:absolute;right:8px;top:8px;width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:rgba(12,15,19,.78);font-size:21px;z-index:4}
#laneTabs{position:absolute;left:50%;top:8px;transform:translateX(-50%);z-index:4}
#laneTabs .seg button{min-width:58px}
#loupe{position:absolute;z-index:5;width:132px;height:132px;border:2px solid var(--gate);border-radius:14px;overflow:hidden;background:#000;pointer-events:none;box-shadow:0 4px 18px rgba(0,0,0,.65)}
#lcv{display:block}
#panel{display:flex;flex-direction:column;gap:8px;background:var(--panel);border-top:1px solid var(--line);max-height:50vh;max-height:50dvh;padding:10px 12px calc(10px + env(safe-area-inset-bottom))}
#hint{font-size:14px;color:#c4ced9;line-height:1.38}
#body{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1;padding:2px 0;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#nav{display:flex;gap:10px}
#nav .btn{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel2);color:var(--tx);font-weight:650;text-decoration:none;text-align:center}
.btn:active{filter:brightness(1.25)}
.btn.primary{background:var(--acc);border-color:transparent;color:#04121f}
.btn.go{background:var(--ok);border-color:transparent;color:#03160c;font-size:18px;font-weight:800}
.btn.small{min-height:44px;padding:6px 12px;font-size:14px}
.btn.sq{min-width:58px;font-size:18px}
.btn.danger{color:#ffb3b5;border-color:#5a2a2d}
.btn:disabled{opacity:.5}
.big2{min-height:66px;font-size:19px;font-weight:800}
.bigrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-height:94px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel2);font-size:17px;font-weight:750}
.big.on{border-color:var(--acc);background:#13283b}
.bi{font-size:30px;line-height:1}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.ct{font-weight:700;font-size:14px;color:#c4ced9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.row.tight{gap:6px;flex-wrap:nowrap}
.col{display:flex;flex-direction:column;gap:8px}
.fl{font-size:14px;color:#c4ced9}
.status{font-size:13.5px;line-height:1.42;padding:9px 11px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);color:#c4ced9;-webkit-user-select:text;user-select:text}
.status.ok{border-color:#1f5a3c;background:#112419;color:#a7f0c6}
.status.warn{border-color:#6a5a1c;background:#241f0e;color:#ffe58a}
.status.bad{border-color:#6a2a2d;background:#2a1214;color:#ffb3b5}
.badtxt{color:var(--warn)}
input[type=text],select{width:100%;min-height:48px;border-radius:12px;border:1px solid var(--line);background:#0e1216;color:var(--tx);padding:8px 12px;font:inherit;-webkit-user-select:text;user-select:text}
.fld{display:flex;flex-direction:column;gap:4px}
.fi{display:flex;align-items:center;gap:8px}
.fi em{font-style:normal;color:var(--mut);min-width:34px}
.stepper{display:inline-flex;align-items:center;gap:6px}
.sb{width:50px;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:24px;font-weight:700}
.sv{min-width:30px;text-align:center;font-size:20px;font-weight:750;font-variant-numeric:tabular-nums}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:#0e1216;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:44px;border:0;border-radius:9px;background:transparent;font-weight:650;color:var(--mut)}
.seg button.on{background:var(--panel2);color:var(--tx);box-shadow:0 0 0 1px var(--acc) inset}
.rng{width:100%;accent-color:var(--acc);height:38px}
.tm{font-variant-numeric:tabular-nums;color:var(--mut);font-size:13px}
.dl{font-variant-numeric:tabular-nums;color:var(--gate);font-weight:750;min-width:70px;text-align:right}
.pair{gap:10px}
.lane{flex-wrap:nowrap}
.lane input{flex:1 1 0;min-width:0}
.lane select{width:auto;flex:0 0 38%}
.chip2{display:inline-flex;align-items:center;justify-content:center;min-width:40px;height:40px;border-radius:10px;background:#3a2a14;color:var(--lane);font-weight:800;flex:none}
.lgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.lb{min-height:54px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:20px;font-weight:800}
.lb.on{background:var(--acc);color:#04121f;border-color:transparent}
.limitbox{display:flex;flex-direction:column;gap:10px}
.nudge{flex-direction:row;align-items:center;justify-content:space-between}
.segd{display:flex;gap:6px}.segd .btn{padding:6px 10px;min-height:34px;font-size:13px}.btn.on{outline:2px solid var(--acc)}
#btnRec.rec{background:rgba(190,34,42,.9);border-color:#ff6b72;color:#fff}
#hud{position:absolute;left:0;right:0;top:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;gap:6px;flex-wrap:wrap;padding:calc(8px + env(safe-area-inset-top)) calc(8px + env(safe-area-inset-right)) 0 calc(8px + env(safe-area-inset-left));pointer-events:none}
.hrow{display:flex;gap:6px;flex-wrap:wrap}
.chip{pointer-events:auto;display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:12px;background:rgba(10,12,15,.76);border:1px solid rgba(255,255,255,.13);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);font-size:13px;color:#dfe6ee;min-height:38px;white-space:nowrap}
.chip b{font-size:16px;font-variant-numeric:tabular-nums}
.chip small{font-size:11px;color:var(--mut)}
.chip.btn{border-color:rgba(255,255,255,.2);font-weight:700}
.chip.warn{border-color:var(--warn);color:var(--warn)}
.dot{width:10px;height:10px;border-radius:50%;background:#6b7684;display:inline-block}
.st-ok .dot{background:var(--ok)}
.st-init .dot{background:var(--warn)}
.st-coast .dot{background:var(--warn)}
.st-lost .dot{background:var(--bad);animation:pulse .8s infinite}
@keyframes pulse{50%{opacity:.3}}
#stageMsg{position:absolute;left:calc(10px + env(safe-area-inset-left));bottom:calc(68px + env(safe-area-inset-bottom));z-index:6;max-width:min(340px,42%);text-align:left;padding:8px 12px;border-radius:12px;background:rgba(10,12,15,.78);border:1px solid rgba(255,255,255,.16);font-weight:600;font-size:13px;line-height:1.3;pointer-events:none}
#levelBox{position:absolute;left:8px;top:8px;z-index:6;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:12px;background:rgba(10,12,15,.76);border:1px solid rgba(255,255,255,.14);font-weight:750;font-variant-numeric:tabular-nums;pointer-events:none;color:var(--mut)}
.run #levelBox{top:calc(104px + env(safe-area-inset-top))}
.lvline{width:48px;height:3px;border-radius:2px;background:currentColor;transition:transform .12s linear}
#levelBox.ok{color:var(--ok)}
#levelBox.warn{color:var(--warn)}
#levelBox.bad{color:var(--bad)}
#fileBar{position:absolute;left:0;right:0;top:0;height:3px;background:rgba(255,255,255,.12);z-index:7}
#fileBar i{display:block;height:100%;width:0;background:var(--acc)}
#drawer{position:absolute;left:0;right:0;bottom:0;z-index:6;display:flex;flex-direction:column;max-height:64%;background:rgba(14,17,21,.96);border-top:1px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(calc(100% - 56px - env(safe-area-inset-bottom)));transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
#drawer.open{transform:none}
#drawerBar{display:flex;justify-content:space-between;align-items:center;min-height:56px;padding:0 16px;border:0;background:transparent;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;text-align:left;flex:none}
#drawerBar i{font-style:normal;transition:transform .25s}
.open #drawerBar i{transform:rotate(180deg)}
#drawerBody{overflow:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:10px;min-height:0;touch-action:pan-y}
#stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sc{background:var(--panel2);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column}
.sc b{font-size:19px;font-variant-numeric:tabular-nums}
.sc small{font-size:10.5px;color:var(--mut)}
.prow{display:grid;grid-template-columns:78px 40px 26px 1fr auto;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.prow.hasSnap{cursor:pointer}
.pk{font-size:18px;text-align:left}
.pt{color:var(--mut);font-size:14px}
.pl{font-weight:700}
.empty{color:var(--mut);padding:12px 4px;text-align:center}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.scard{width:min(560px,100%);max-height:88vh;max-height:88dvh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px 20px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:18px}
.shead button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-size:18px}
.sets{display:flex;flex-direction:column;gap:10px}
.swrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px}
.swt{display:flex;flex-direction:column}
.swt small{color:var(--mut);font-size:12.5px}
.sw{position:relative;width:54px;height:32px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0}
.sw i{position:absolute;inset:0;border-radius:16px;background:#2a323c;transition:background .15s}
.sw i::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .15s}
.sw input:checked+i{background:var(--ok)}
.sw input:checked+i::after{transform:translateX(22px)}
.fine{font-size:12px;line-height:1.5;color:var(--mut);margin:6px 0 0;-webkit-user-select:text;user-select:text}
.snap img{width:100%;border-radius:12px;display:block;margin-bottom:8px;-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%) translateY(12px);z-index:80;max-width:92vw;padding:11px 15px;border-radius:12px;background:#222a34;border:1px solid #3a4452;color:#eef3f8;font-size:14px;line-height:1.35;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
body.running #toast{bottom:calc(env(safe-area-inset-bottom) + 74px)}
#app.run{grid-template-rows:minmax(0,1fr);padding:0}
#app.run #hdr,#app.run #panel{display:none}
@media (orientation:landscape){
  #app:not(.run){grid-template-columns:minmax(0,1fr) minmax(310px,38%);grid-template-rows:auto minmax(0,1fr)}
  #app:not(.run) #hdr{grid-column:1/-1}
  #app:not(.run) #stage{grid-column:1;grid-row:2}
  #app:not(.run) #panel{grid-column:2;grid-row:2;max-height:none;border-top:0;border-left:1px solid var(--line)}
  #drawer{max-height:78%}
}
@media (max-width:480px){#dots{display:none}}
@media (max-width:480px){.chip{padding:5px 9px;min-height:36px;font-size:12.5px}.chip b{font-size:15px}.hrow{gap:5px}}
@media (max-width:380px){.chip{padding:5px 7px}.prow{grid-template-columns:70px 34px 24px 1fr auto}}
.dtabs{display:flex;gap:6px}
.dtab{flex:1;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel2);font-weight:700;font-size:14px;color:var(--mut)}
.dtab.on{color:var(--tx);box-shadow:0 0 0 1px var(--acc) inset}
.dtab.v.on{box-shadow:0 0 0 1px #ff7a59 inset}
#vpane{display:flex;flex-direction:column}
.vrow{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line);cursor:pointer;font-variant-numeric:tabular-nums}
.vth{width:64px;height:48px;border-radius:8px;object-fit:cover;background:#000;display:block}
.vth.none{display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:11px;background:var(--panel2)}
.vk{font-size:18px;font-weight:800;color:#ff7a59}
.vm{font-size:12px;color:var(--mut)}
.vsrc{font-size:11.5px;color:var(--mut);text-align:right;max-width:34vw}
.vdet{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.vdet div{background:var(--panel2);border-radius:10px;padding:7px 9px}
.vdet b{display:block;font-size:16px}
.vdet small{color:var(--mut);font-size:11px}
.plate{font:800 20px ui-monospace,Menlo,Consolas,monospace;letter-spacing:2px;padding:6px 10px;border-radius:8px;background:#f2f2f2;color:#111;display:inline-block}
.snap .row{margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <header id="hdr">
    <div class="ttl"><span id="stepNum">1 / 6</span><b id="stepName">Источник</b></div>
    <div id="dots"></div>
    <button id="btnGear" class="icon" type="button" aria-label="Настройки">⚙</button>
  </header>
  <div id="stage">
    <video id="video" playsinline webkit-playsinline muted></video>
    <canvas id="cv"></canvas>
    <button id="btnFit" class="fitbtn" type="button" hidden aria-label="Сбросить масштаб кадра">⤢</button>
    <div id="laneTabs" hidden></div>
    <div id="loupe" hidden><canvas id="lcv"></canvas></div>
    <div id="levelBox" hidden><div class="lvline"></div><span>—</span></div>
    <div id="stageMsg" hidden></div>
    <div id="fileBar" hidden><i></i></div>
    <div id="hud" hidden>
      <div class="hrow">
        <div class="chip" id="chFps"><b>—</b><small>fps</small></div>
        <div class="chip st-off" id="chStab"><i class="dot"></i><span>стаб.</span></div>
        <button class="chip btn" id="chLimit" type="button"><b>50</b><small>лимит</small></button>
        <div class="chip" id="chCnt"><b>0</b><small>проездов</small></div>
      </div>
      <div class="hrow">
        <button class="chip btn" id="btnRestart" type="button" hidden aria-label="Заново">↺</button>
        <button class="chip btn" id="btnPause" type="button">⏸ Пауза</button>
        <button class="chip btn" id="btnRec" type="button">⏺ Запись</button>
        <button class="chip btn" id="btnReconf" type="button">⚙ Перенастроить</button>
        <button class="chip btn" id="btnMenu" type="button" aria-label="Меню">☰</button>
      </div>
    </div>
    <div id="drawer" hidden>
      <button id="drawerBar" type="button"><span id="drawerSum">Проезды: пока нет</span><i>▲</i></button>
      <div id="drawerBody"><div id="dtabs" class="dtabs" hidden></div><div id="stats"></div><div id="plist"></div><div id="vpane" hidden></div></div>
    </div>
  </div>
  <section id="panel">
    <div id="hint"></div>
    <div id="body"></div>
    <div id="nav"><button id="btnBack" class="btn" type="button" hidden>Назад</button><button id="btnNext" class="btn primary" type="button">Далее</button></div>
  </section>
</div>
<div id="sheet" class="sheet" hidden><div class="scard"><div class="shead"><b id="sheetTitle"></b><button id="sheetClose" type="button" aria-label="Закрыть">✕</button></div><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<input id="fileIn" type="file" accept="video/*" hidden>
<script>
"use strict";
/* ПРАВИЛА ПРОЕКТА (в приложенной версии текста правил не оказалось — здесь записи этой части; новые поля S и функции дописывать сюда)
 * S.lanes.n — общее число полос (шаги 3 и 4, setLaneCount). S.gates — общий набор {n,v,aim,mode,markM,steps,meters,sel}
 *   + perLane (режим «свои ворота»), lane (выбранная полоса, с 0), L[] (наборы по полосам того же вида).
 * S.calibs[i] — калибровка полосы i (в общем режиме все элементы — один объект), S.calib — выбранной полосы.
 *   Калибровка: {a,b,c,rms,vNear,vFar,sMax,...}; зона полосы — от vNear (низ кадра) до vFar (последние ворота + 10 %).
 * Наклон ворот: g.rot[i] — угол линии ворот i (рад., + = правая сторона ниже), поворот вокруг кольца aim; v — строка в точке кольца.
 *   Калибровка идёт по строкам опорной колонки XR (gateVr); cal.til = tiltOf(g) — семейство наклонных линий; v трекера = tiltV(til, x, y).
 * Функции: GS(i), fixSet, cloneSet, recalc, calsOk, lanePre, lanePath, laneTabs, packSet/readSet, analysisH;
 *   CORE: calAt/sOfV/vOfS(cals, …, индекс полосы), wlsLine; Tracker._sample/_live (σ точки, окно, фильтр).
 * Нарушители (необязательный шаг 6): S.viol {on, over, distMode, distM, strip, ocr, gates(2)}, S.vlist (записи), CONFIG.viol; блок «Высокие нарушения» — FastGates (D÷t), violGrab/violPhoto, vcVote/vcClass (тип ТС по классу рамки детектора), ANPR (OCR отдельно).
 * CFG.* из ТЗ = CONFIG.track.*: edgeSigmaPx, maxRelErr, showErr, minWinSec, winMaxSec, maxAccel, maxPxMeters.
 */
/* ==== CORE:BEGIN ==== */
const CONFIG = {
  // ---------- Кадр и камера ----------
  analysisWidth: 640,          // размер кадра анализа по длинной стороне, px
  smoothing: 'medium',         // качество уменьшения кадра: low | medium | high
  camera: { width: 1920, height: 1080, fps: 60 }, // желаемый режим камеры
  maxFrameSide: 4096,          // макс. сторона замороженного кадра, px
  // ---------- Калибровка (ворота) ----------
  calib: {
    minGates: 3, maxGates: 6, defaultGates: 4,
    minSpanM: 10,              // предупреждение, если крайние ворота ближе друг к другу, м
    warnRmsPct: 5,             // предупреждение, если невязка больше, % от базы

const clamp = (v, a, b) => (v < a ? a : (v > b ? b : v));
function median(a) {
  if (!a.length) return 0;
  const s = Array.from(a).sort((x, y) => x - y), n = s.length;
  return n % 2 ? s[n >> 1] : 0.5 * (s[n / 2 - 1] + s[n / 2]);
}

function solve3(M, y) {
  const A = [M[0].concat(y[0]), M[1].concat(y[1]), M[2].concat(y[2])];
  let scale = 0;
  for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) scale = Math.max(scale, Math.abs(M[i][j]));
  if (!(scale > 0)) return null;
  for (let c = 0; c < 3; c++) {
    let p = c;
    for (let r = c + 1; r < 3; r++) if (Math.abs(A[r][c]) > Math.abs(A[p][c])) p = r;
    if (Math.abs(A[p][c]) < 1e-12 * scale) return null;
    if (p !== c) { const t = A[p]; A[p] = A[c]; A[c] = t; }
    for (let r = c + 1; r < 3; r++) {
      const f = A[r][c] / A[c][c];
      for (let k = c; k < 4; k++) A[r][k] -= f * A[c][k];
    }
  }
  const x = [0, 0, 0];
  for (let i = 2; i >= 0; i--) {
    let s = A[i][3];
    for (let k = i + 1; k < 3; k++) s -= A[i][k] * x[k];
    x[i] = s / A[i][i];
  }
  return x;
}

/* ---------- Калибровка: s(v) = (a v + b) / (c v + 1) ---------- */
function fitProjective(vs, ss, refine) {
  const n = vs.length, w = new Array(n).fill(1);
  let sol = null;
  const iters = 1 + Math.max(0, refine | 0);
  for (let it = 0; it < iters; it++) {
    const M = [[0, 0, 0], [0, 0, 0], [0, 0, 0]], y = [0, 0, 0];
    for (let i = 0; i < n; i++) {
      const r = [vs[i], 1, -vs[i] * ss[i]], w2 = w[i] * w[i];
      for (let p = 0; p < 3; p++) {
        y[p] += w2 * r[p] * ss[i];
        for (let q = 0; q < 3; q++) M[p][q] += w2 * r[p] * r[q];
      }
    }
    const x = solve3(M, y);
    if (!x) return sol;
    sol = { a: x[0], b: x[1], c: x[2] };
    for (let i = 0; i < n; i++) {
      const den = Math.abs(sol.c * vs[i] + 1);
      w[i] = den > 1e-6 ? 1 / den : 1;
    }
  }
  return sol;
}

// vs — строки ворот (доли высоты кадра), от ближних (большое v) к дальним; ds — расстояния между соседними, м
function makeCalib(vs, ds, cfg) {
  cfg = cfg || CONFIG.calib;
  const n = vs.length;
  const out = { ok: false, err: null, warns: [], vs: vs.slice(), ss: [0] };
  for (let i = 1; i < n; i++) out.ss.push(out.ss[i - 1] + (ds[i - 1] || 0));
  for (let i = 1; i < n; i++) {
    if (!(ds[i - 1] > 0)) { out.err = 'Расстояние между воротами ' + i + ' и ' + (i + 1) + ' должно быть больше 0.'; return out; }
    if (!(vs[i] < vs[i - 1] - 1e-5)) { out.err = 'Ворота должны идти снизу вверх без пересечений (проверь ворота ' + i + ' и ' + (i + 1) + ').'; return out; }
  }
  const fit = fitProjective(vs, out.ss, cfg.refineIters);
  if (!fit) { out.err = 'Не удалось подобрать масштаб: ворота расставлены вырожденно.'; return out; }
  const { a, b, c } = fit;
  const sLast = out.ss[n - 1], sMax = cfg.rangeFactor * sLast;
  const sOf = v => (a * v + b) / (c * v + 1);
  const vOf = s => (b - s) / (s * c - a);
  if (!(a - b * c < 0)) { out.err = 'Расстояние не растёт вверх по кадру. Проверь порядок ворот и введённые расстояния.'; return out; }
  const dd = sMax * c - a;
  if (!isFinite(dd) || Math.abs(dd) < 1e-9) { out.err = 'Рабочий диапазон уходит за горизонт. Сдвинь верхние ворота ниже или проверь расстояния.'; return out; }
  let vFar = (b - sMax) / dd;
  const sg = Math.sign(c * vs[0] + 1) || 1;
  if (!isFinite(vFar) || (c * 1 + 1) * sg <= 0 || (c * vFar + 1) * sg <= 0 || vFar >= vs[n - 1]) {
    out.err = 'Горизонт попадает в рабочий диапазон: масштаб неверный. Сдвинь верхние ворота ниже или проверь расстояния между воротами.';
    return out;
  }
  vFar = Math.max(vFar, 0.02);
  let se = 0;
  for (let i = 0; i < n; i++) { const r = sOf(vs[i]) - out.ss[i]; se += r * r; }
  out.rms = Math.sqrt(se / n);
  out.rmsPct = sLast > 0 ? 100 * out.rms / sLast : 0;
  out.exact = n <= 3;
  if (!out.exact && out.rmsPct > cfg.warnRmsPct) out.warns.push('Невязка калибровки ' + out.rmsPct.toFixed(1) + '% больше ' + cfg.warnRmsPct + '%: точки ворот стоят не на одной линии вдоль дороги или расстояния введены неточно.');
  if (sLast < cfg.minSpanM) out.warns.push('Расстояние между крайними воротами меньше ' + cfg.minSpanM + ' м — точность масштаба снизится.');
  Object.assign(out, { ok: true, a, b, c, sOf, vOf, vNear: 1, vFar, sMax, sBottom: sOf(1), sLast });
  return out;
}

// Калибровка полосы li (с 0); cals[i] — калибровка полосы i, в общем режиме все элементы — один объект
const calAt = (cals, li) => cals[clamp(li | 0, 0, cals.length - 1)];
const sOfV = (cals, v, li) => calAt(cals, li).sOf(v);
const vOfS = (cals, s, li) => calAt(cals, li).vOf(s);

/* ---------- Геометрия полос ---------- */
const XR = 0.5;   // опорная колонка (доля ширины): калибровка ведётся по строкам кадра в этой колонке
// Наклон ворот → { xr, vr[], ks[], span } по возрастанию vr; ks — dv/dx в долях кадра (tgθ·ширина/высота). null, если все ворота горизонтальны
function tiltOf(g, asp) {
  const rot = g.rot || [], P = []; let any = false;
  for (let i = 0; i < g.n; i++) {
    const th = +rot[i] || 0, ks = Math.tan(th) * asp;
    if (Math.abs(th) > 1e-4) any = true;
    P.push({ vr: g.v[i] + ks * (XR - g.aim[i]), ks });
  }
  if (!any) return null;
  P.sort((p, q) => p.vr - q.vr);
  return { xr: XR, vr: P.map(p => p.vr), ks: P.map(p => p.ks), span: 0.5 * Math.max(...P.map(p => Math.abs(p.ks))) };
}
function tiltK(til, vr) {   // наклон семейства линий на опорной строке vr: линейная интерполяция между воротами, за крайними — постоянный
  const V = til.vr, K = til.ks, n = V.length;
  if (vr <= V[0]) return K[0];
  if (vr >= V[n - 1]) return K[n - 1];
  let i = 1; while (V[i] < vr) i++;
  return K[i - 1] + (K[i] - K[i - 1]) * (vr - V[i - 1]) / (V[i] - V[i - 1]);
}
const tiltY = (til, x, vr) => vr + tiltK(til, vr) * (x - til.xr);   // строка кадра, где линия семейства vr проходит через колонку x
function tiltV(til, x, y) {   // обратно: точка (x, y) → строка vr опорной колонки на той же линии семейства (деление пополам: устойчиво, даже если наклон меняется быстро)
  const dx = x - til.xr, m = 2 * til.span * Math.abs(dx) + 0.01;
  let lo = y - m, hi = y + m;
  for (let k = 0; k < 26; k++) {
    const mid = 0.5 * (lo + hi);
    if (mid + tiltK(til, mid) * dx < y) lo = mid; else hi = mid;
  }
  return 0.5 * (lo + hi);
}

function xAtY(b, y) {
  const dy = b.y2 - b.y1;
  return Math.abs(dy) < 1e-6 ? b.x1 : b.x1 + (y - b.y1) * (b.x2 - b.x1) / dy;
}

// bounds — N+1 линий {x1,y1,x2,y2} (нормированные). Возвращает карту полос и границы строк.
function buildGeometry(aw, ah, bounds, calib, cfg) {
  cfg = cfg || CONFIG.lanes;
  const N = bounds.length - 1;
  const yTop = Math.max(1, Math.floor((calib.vFar - cfg.detTopMargin) * ah));
  const map = new Uint8Array(aw * ah);
  const rowX0 = new Int16Array(ah), rowX1 = new Int16Array(ah);
  const xsAt = new Float32Array(ah * (N + 1));
  const stat = new Uint8Array(aw * ah).fill(1);
  const xs = new Array(N + 1);
  let minX = aw, maxX = 0;
  for (let y = 0; y < ah; y++) {
    const yn = (y + 0.5) / ah;
    for (let k = 0; k <= N; k++) xs[k] = xAtY(bounds[k], yn) * aw;
    xs.sort((p, q) => p - q);
    for (let k = 0; k <= N; k++) xsAt[y * (N + 1) + k] = xs[k];
    if (y < yTop - Math.round(0.05 * ah)) continue;
    const wr = xs[N] - xs[0];
    if (wr < 4) continue;
    // зона дороги для стабилизации (шире зоны обнаружения)
    const m2 = 0.15 * wr + 8;
    const sa = Math.max(0, Math.floor(xs[0] - m2)), sb = Math.min(aw, Math.ceil(xs[N] + m2));
    for (let x = sa; x < sb; x++) stat[y * aw + x] = 0;
    if (y < yTop) continue;
    const m = cfg.margin * wr;
    const xl = Math.max(1, Math.floor(xs[0] - m)), xr = Math.min(aw - 1, Math.ceil(xs[N] + m));
    let lane = 1;
    for (let x = xl; x < xr; x++) {
      const xc = x + 0.5;
      while (lane < N && xc >= xs[lane]) lane++;
      map[y * aw + x] = lane;
    }
    rowX0[y] = xl; rowX1[y] = xr;
    if (xl < minX) minX = xl;
    if (xr > maxX) maxX = xr;
  }
  const yMid = Math.min(ah - 1, Math.round((yTop + ah) / 2));
  const pivot = { x: 0.5 * (xsAt[yMid * (N + 1)] + xsAt[yMid * (N + 1) + N]), y: yMid };
  return { aw, ah, N, y0: yTop, map, rowX0, rowX1, xsAt, stat, pivot, minX, maxX };
}

function laneWidthAt(geo, y, lane) {
  const yy = clamp(Math.round(y), 0, geo.ah - 1), N1 = geo.N + 1;
  return geo.xsAt[yy * N1 + lane] - geo.xsAt[yy * N1 + lane - 1];
}


/* ---------- Стабилизация: сдвиг (tx, ty) и малый поворот θ относительно калибровочного кадра ---------- */
function down2(src, sw, sh, dst) {
  const dw = sw >> 1, dh = sh >> 1;
  for (let y = 0; y < dh; y++) {
    let i = 2 * y * sw, j = y * dw;
    for (let x = 0; x < dw; x++, i += 2, j++) dst[j] = (src[i] + src[i + 1] + src[i + sw] + src[i + sw + 1]) * 0.25;
  }
}

class Stabilizer {
  constructor(cfg) { this.cfg = cfg || CONFIG.stab; this.ok = false; this.nb = 0; this.blocks = []; this.nSkip = 0; this._skip = null; }

  init(gray, w, h, staticMask, pivot) {
    const cfg = this.cfg;
    this.w = w; this.h = h; this.pivot = pivot; this.ok = false; this.nSkip = 0; this._skip = null;
    const l0 = Float32Array.from(gray);
    const w1 = w >> 1, h1 = h >> 1, w2 = w1 >> 1, h2 = h1 >> 1;
    const l1 = new Float32Array(w1 * h1), l2 = new Float32Array(w2 * h2);
    down2(l0, w, h, l1); down2(l1, w1, h1, l2);
    this.cal = [{ w, h, d: l0 }, { w: w1, h: h1, d: l1 }, { w: w2, h: h2, d: l2 }];
    this.cur1 = new Float32Array(w1 * h1); this.cur2 = new Float32Array(w2 * h2);
    const B = cfg.block, cells = [];
    const cw = Math.floor(w / B), ch = Math.floor(h / B), offX = (w - cw * B) >> 1, offY = (h - ch * B) >> 1;
    for (let cy = 0; cy < ch; cy++) for (let cx = 0; cx < cw; cx++) {
      const x0 = offX + cx * B, y0 = offY + cy * B;
      let ok = true;
      for (let y = y0; y < y0 + B && ok; y += 4) for (let x = x0; x < x0 + B; x += 4) if (!staticMask[y * w + x]) { ok = false; break; }
      if (!ok) continue;
      let e = 0, nn = 0;
      for (let y = Math.max(y0, 1); y < Math.min(y0 + B, h - 1); y += 2) for (let x = Math.max(x0, 1); x < Math.min(x0 + B, w - 1); x += 2) {
        const gx = (l0[y * w + x + 1] - l0[y * w + x - 1]) * 0.5, gy = (l0[(y + 1) * w + x] - l0[(y - 1) * w + x]) * 0.5;
        e += gx * gx + gy * gy; nn++;

      if (e >= cfg.minTexture) cells.push({ x0, y0, e });
    }
    cells.sort((p, q) => q.e - p.e);
    const picked = [], taken = new Uint8Array(cells.length);
    for (const sep of [2.2, 1.6, 1.0]) {
      for (let i = 0; i < cells.length && picked.length < cfg.maxBlocks; i++) {
        if (taken[i]) continue;
        const c = cells[i];
        let far = true;
        for (const p of picked) if (Math.hypot(p.x0 - c.x0, p.y0 - c.y0) < sep * B - 1e-6) { far = false; break; }
        if (far) { taken[i] = 1; picked.push(c); }

    this.levels = [0, 1, 2].map(l => this._level(l, picked));
    const nb = Math.max(1, this.nb);

    this._wb = new Float64Array(nb); this._nv = new Uint8Array(nb); this._tmp = new Float64Array(nb);

  }

  // boxes — рамки машин в калибровочных координатах {x0,y0,x1,y1}: блоки, задетые рамкой, не участвуют в оценке (если останется меньше minBlocks — исключения игнорируются)
  setExclusions(boxes) {
    const B = this.cfg.block, n = this.nb;
    if (!this._skip || this._skip.length !== n) this._skip = new Uint8Array(n);
    let k = 0;
    for (let i = 0; i < n; i++) {
      const c = this.blocks[i]; let hit = 0;
      for (const r of boxes) if (c.x0 < r.x1 && c.x0 + B > r.x0 && c.y0 < r.y1 && c.y0 + B > r.y0) { hit = 1; break; }
      this._skip[i] = hit; k += hit;
    }
    if (n - k < this.cfg.minBlocks) { this._skip.fill(0); k = 0; }
    this.nSkip = k;
  }

  _level(l, picked) {
    const B = this.cfg.block, s = 1 << l, img = this.cal[l], W = img.w, Hh = img.h, d = img.d;
    const st = l === 0 ? 2 : 1, px = this.pivot.x / s, py = this.pivot.y / s;
    const X = [], Y = [], T = [], GX = [], GY = [], GJ = [], bs = [], be = [];
    for (const c of picked) {
      bs.push(X.length);
      const xa = Math.max(1, Math.ceil(c.x0 / s)), xb = Math.min(W - 2, Math.floor((c.x0 + B) / s) - 1);
      const ya = Math.max(1, Math.ceil(c.y0 / s)), yb = Math.min(Hh - 2, Math.floor((c.y0 + B) / s) - 1);
      for (let y = ya; y <= yb; y += st) for (let x = xa; x <= xb; x += st) {
        const i = y * W + x;

    for (let b = 0; b < nb; b++) {
      let a00 = 0, a01 = 0, a02 = 0, a11 = 0, a12 = 0, a22 = 0, s0 = 0, s1 = 0, s2 = 0, sT = 0, sT2 = 0;
      const n = be[b] - bs[b];
      for (let k = bs[b]; k < be[b]; k++) {

        const gx = GX[k], gy = GY[k], gj = GJ[k];
        a00 += gx * gx; a01 += gx * gy; a02 += gx * gj; a11 += gy * gy; a12 += gy * gj; a22 += gj * gj;
        s0 += gx; s1 += gy; s2 += gj;
      }
      const nn = Math.max(n, 1);
      VT[b] = Math.max(sT2 / nn - (sT / nn) * (sT / nn), 0);
      H.set([a00 - s0 * s0 / nn, a01 - s0 * s1 / nn, a02 - s0 * s2 / nn, a11 - s1 * s1 / nn, a12 - s1 * s2 / nn, a22 - s2 * s2 / nn], b * 6);
      S.set([s0, s1, s2], b * 3);

  }

  // Один уровень Гаусса–Ньютона (обратно-композиционный LK, сдвиг + поворот, смещение яркости по блоку, робастные веса блоков)
  _lk(lv, cur, p, iters) {
    const cfg = this.cfg, nb = lv.nb, W = cur.w, Hh = cur.h, d = cur.d;
    const gb = this._gb, eb = this._eb, wb = this._wb, nv = this._nv, sk = this.nSkip ? this._skip : null;
    let inl = 0, rho = 99, fail = false, conv = false, lastStep = 99;
    const floor2 = cfg.errFloor * cfg.errFloor;
    for (let it = 0; it < iters; it++) {
      const tx = p[0], ty = p[1], th = p[2];
      let nvalid = 0;
      for (let b = 0; b < nb; b++) {
        let g0 = 0, g1 = 0, g2 = 0, se = 0, se2 = 0, cnt = 0;
        if (sk && sk[b]) { nv[b] = 0; eb[b] = 1e9; continue; }
        const k1 = lv.be[b];
        for (let k = lv.bs[b]; k < k1; k++) {
          const qx = lv.X[k] + tx - th * lv.UY[k], qy = lv.Y[k] + ty + th * lv.UX[k];
          if (qx < 0 || qy < 0 || qx >= W - 1 || qy >= Hh - 1) continue;
          const x0 = qx | 0, y0 = qy | 0, fx = qx - x0, fy = qy - y0, i0 = y0 * W + x0;
          const a = d[i0] + (d[i0 + 1] - d[i0]) * fx, c = d[i0 + W] + (d[i0 + W + 1] - d[i0 + W]) * fx;

          g0 += lv.GX[k] * e; g1 += lv.GY[k] * e; g2 += lv.GJ[k] * e; se += e; se2 += e * e; cnt++;
        }

        eb[b] = Math.sqrt(Math.max(se2 / cnt - me * me, 0)); nv[b] = 1; nvalid++;
      }
      if (nvalid < 2) { fail = true; break; }
      let h00 = 0, h01 = 0, h02 = 0, h11 = 0, h12 = 0, h22 = 0, g0 = 0, g1 = 0, g2 = 0, rs = 0;
      inl = 0;
      const reweight = it < cfg.reweightIters;   // веса блоков пересчитываем только в первых итерациях, дальше фиксируем — так LK надёжно сходится
      for (let b = 0; b < nb; b++) {
        let w = 0;
        if (nv[b]) {
          if (reweight) {
            const thr = Math.max(cfg.errFloor, Math.sqrt(cfg.rhoMax * lv.VT[b]));
            w = eb[b] <= thr ? 1 : (eb[b] >= 2 * thr ? 0 : 2 - eb[b] / thr);
          } else w = wb[b];
        }
        wb[b] = w;
        if (w <= 0) continue;
        h00 += w * lv.H[b * 6]; h01 += w * lv.H[b * 6 + 1]; h02 += w * lv.H[b * 6 + 2];
        h11 += w * lv.H[b * 6 + 3]; h12 += w * lv.H[b * 6 + 4]; h22 += w * lv.H[b * 6 + 5];
        g0 += w * gb[b * 3]; g1 += w * gb[b * 3 + 1]; g2 += w * gb[b * 3 + 2];
        if (w >= 0.5) { inl++; rs += eb[b] * eb[b] / Math.max(lv.VT[b], floor2); }
      }
      rho = inl ? rs / inl : 99;
      const ridge = cfg.rollPrior * 0.5 * (h00 + h11) * Math.pow(0.1 * lv.w, 2) + 1e-9;
      const dp = solve3([[h00, h01, h02], [h01, h11, h12], [h02, h12, h22 + ridge]], [g0, g1, g2]);
      if (!dp) { fail = true; break; }
      p[0] -= dp[0]; p[1] -= dp[1]; p[2] = clamp(p[2] - dp[2], -cfg.maxRoll, cfg.maxRoll);
      const stepPx = Math.max(Math.abs(dp[0]), Math.abs(dp[1]), Math.abs(dp[2]) * 0.3 * lv.w);
      lastStep = stepPx;
      if (stepPx < cfg.convTol) { conv = true; if (stepPx < 0.003) break; }
      else conv = false;
    }
    return { p, inl, rho, conv, fail, step: lastStep };
  }

  // Пирамида L2 → L1 → L0. Если на полном разрешении кадр смазан (оценка не проходит), принимаем результат уровня L1
  _refine(cur0, cur1, cur2, p0) {

    const bad = { ok: false, p: p0.slice(), inl: 0, rho: 99 };
    let p = [p0[0] / 4, p0[1] / 4, p0[2]];
    const r2 = this._lk(this.levels[2], cur2, p, cfg.iterL2 + ex);
    if (r2.fail) return bad;
    p = [r2.p[0] * 2, r2.p[1] * 2, r2.p[2]];
    const r1 = this._lk(this.levels[1], cur1, p, cfg.iterL1 + ex);
    if (r1.fail) return bad;
    const pL1 = [r1.p[0] * 2, r1.p[1] * 2, r1.p[2]];
    const ok1 = r1.inl >= need && r1.rho <= cfg.rhoOk && r1.step < 2 * cfg.convTol;
    const r0 = this._lk(this.levels[0], cur0, pL1.slice(), cfg.iterL0 + ex);
    if (!r0.fail) {
      const ok0 = r0.inl >= need && r0.rho <= cfg.rhoOk && r0.step < 2 * cfg.convTol;
      if (ok0 || !ok1) return { ok: ok0, p: r0.p, inl: r0.inl, rho: r0.rho, step: r0.step };
    }
    return ok1 ? { ok: true, p: pL1, inl: r1.inl, rho: r1.rho, step: r1.step * 2, coarse: true } : bad;
  }

  // Расширенный поиск целочисленного сдвига на уровне L2: грубая сетка (шаг 3) на ±searchRadius + уточнение ±2 у лучших + окрестность прогноза.
  // Возвращает до 3 кандидатов [tx, ty, 0] (px L0), лучшие первыми. Мера — устойчивый SAD без смещения яркости по лучшей половине блоков.
  _search(cur2, prior) {
    const cfg = this.cfg, lv = this.levels[2], W = lv.w, Hh = lv.h, nb = lv.nb;
    const R = Math.max(3, Math.ceil(cfg.searchRadius / 4)), ST = 2;
    const act = nb - this.nSkip, sk = this.nSkip ? this._skip : null, keep = Math.max(3, Math.ceil(act * 0.5)), srt = new Float64Array(nb);
    const cost = (dx, dy) => {
      let bad = 0, m = 0;
      for (let b = 0; b < nb; b++) {
        if (sk && sk[b]) continue;
        const k0 = lv.bs[b], k1 = lv.be[b];
        let sI = 0, sT = 0, oob = false;

/* ---------- Прямое и обратное преобразование «калибровочные координаты ↔ текущий кадр» ---------- */
function warpFwd(p, pivot, x, y) {   // калибровочные → текущий кадр (координаты анализа)
  const ux = x - pivot.x, uy = y - pivot.y;
  return [x + p[0] - p[2] * uy, y + p[1] + p[2] * ux];
}

  const dx = qx - pivot.x - p[0], dy = qy - pivot.y - p[1], k = 1 / (1 + p[2] * p[2]);
  return [pivot.x + (dx + p[2] * dy) * k, pivot.y + (-p[2] * dx + dy) * k];
}

/* ---------- Уточнение кромки по профилю яркости кадра исходного разрешения (чистая функция) ---------- */
// rows — средние яркости строк (по выбранным столбцам), yc — приблизительная кромка (граница строк, px), 
// возвращает кромку в тех же координатах или null

    if (!ok) { sc.push(0); continue; }
    for (let j = 0; j < k; j++) { a += rows[e - 1 - j]; b += rows[e + j]; }
    sc.push(Math.abs(b - a) / k);
  }

  for (let i = 1; i < sc.length - 1; i++) if (sc[i] > bv) { bv = sc[i]; bi = i; }

/* ---------- Робастная линейная регрессия s(t): Тейл–Сен + перевзвешенный МНК (Тьюки) ---------- */

  _sample(tr, b, t) {

/* =====================  Лимит по GPS + OpenStreetMap  ===================== */
function distToWay(lat, lon, geom) {
  const kx = 111320 * Math.cos(lat * Math.PI / 180), ky = 110540;
  if (!geom || !geom.length) return Infinity;
  if (geom.length === 1) return Math.hypot((geom[0].lon - lon) * kx, (geom[0].lat - lat) * ky);
  let best = Infinity;
  for (let i = 0; i + 1 < geom.length; i++) {
    const ax = (geom[i].lon - lon) * kx, ay = (geom[i].lat - lat) * ky, bx = (geom[i + 1].lon - lon) * kx, by = (geom[i + 1].lat - lat) * ky;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy;
    const t = L2 > 0 ? clamp(-(ax * dx + ay * dy) / L2, 0, 1) : 0;
    best = Math.min(best, Math.hypot(ax + t * dx, ay + t * dy));
  }
  return best;
}
async function detectLimitGps(progress) {
  if (!navigator.geolocation) throw new Error('Геопозиция недоступна в этом браузере. Введи лимит вручную.');
  progress('Определяю местоположение (до 10 с)…');
  let pos;
  try {
    pos = await new Promise((res, rej) => navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }));
  } catch (e) {
    const c = e && e.code;
    throw new Error(c === 1 ? 'Доступ к геопозиции запрещён. Разреши его для сайта в настройках браузера или введи лимит вручную.' : (c === 3 ? 'Геопозиция не определилась за 10 с. Выйди на открытое место или введи лимит вручную.' : 'Не удалось определить местоположение. Введи лимит вручную.'));
  }
  progress('Ищу дорогу в OpenStreetMap (до 8 с)…');
  const lat = pos.coords.latitude, lon = pos.coords.longitude;
  const q = '[out:json][timeout:8];way(around:25,' + lat.toFixed(6) + ',' + lon.toFixed(6) + ')["highway"];out tags geom;';
  const ctl = new AbortController(), tm = setTimeout(() => ctl.abort(), 8000);
  let data;
  try {
    const r = await fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q), headers: { 'Content-Type': 'application/x-www-form-urlencoded;charset=UTF-8' }, signal: ctl.signal });
    if (!r.ok) throw new Error('HTTP ' + r.status);
    data = await r.json();
  } catch (e) {
    return { kmh: 0, text: 'Не найден: ' + (e && e.name === 'AbortError' ? 'сервер OpenStreetMap не ответил за 8 с' : 'ошибка запроса') + '. Введи лимит вручную.' };
  } finally { clearTimeout(tm); }
  const ways = (data && data.elements || []).filter(w => w.type === 'way' && w.geometry && w.tags);
  if (!ways.length) return { kmh: 0, text: 'Не найден: рядом нет дорог в OpenStreetMap. Введи лимит вручную.' };
  let best = null, bd = Infinity;
  for (const w of ways) { const d = distToWay(lat, lon, w.geometry); if (d < bd) { bd = d; best = w; } }
  const tg = best.tags, name = tg.name || tg.ref || 'без названия';
  const m = /^\s*(\d{1,3})\s*(km\/h)?\s*$/i.exec(tg.maxspeed || '');
  if (!m) return { kmh: 0, text: 'Не найден: для дороги «' + name + '» в OpenStreetMap нет числового ограничения. Введи лимит вручную.' };
  const kmh = parseInt(m[1], 10);
  const text = 'Улица: ' + name + ' — ' + kmh + ' км/ч. Источник: OpenStreetMap. Данные OSM бывают неточными — сверяйся со знаком.';
  S.limitSrc = text;
  return { kmh, text };
}

const LV = { handler: null, roll: null, raf: 0 };
function levelButton() {

async function enableLevel() {

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      const r = await DeviceOrientationEvent.requestPermission();
      if (r !== 'granted') { toast('Доступ к датчикам движения запрещён: индикатор крена недоступен.'); return; }
    }

  warn: { bg: 'rgba(255,224,117,.96)', ink: '#2b2300', line: '#f2b705' },
  bad:  { bg: 'rgba(190,34,42,.96)', ink: '#ffffff', line: '#ff4650' },

const GAP_COL = ['', '#ffd23f', '#ff3b30'];   // дистанция: норма / близко / опасно
function gapText(gp, paren) {

const TAG_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';

function drawTag(g, o, placed) {

  g.font = '800 ' + big + 'px ' + TAG_FONT;
  const wNum = g.measureText(num).width;
  const l1 = (o.dir < 0 ? '▼ ' : (o.dir > 0 ? '▲ ' : '')) + 'П' + o.lane + ' | №' + o.id, l2 = 'км/ч' + (o.acc > 0 ? ' ↗' : (o.acc < 0 ? ' ↘' : ''));
  g.font = '650 ' + sm + 'px ' + TAG_FONT;
  const gp = o.kmh == null ? null : o.gap, gt = gp ? gapText(gp) : '', bp = gp && gp.lvl ? sm * 0.6 : 0, wSep = gt ? g.measureText(' | ').width : 0, wGt = gt ? g.measureText(gt).width + bp : 0, wL2 = g.measureText(l2).width + wSep + wGt;   // дистанция до машины впереди — в нижней строке
  const wTxt = o.kmh == null ? 0 : Math.max(g.measureText(l1).width, wL2);

  g.font = '800 ' + big + 'px ' + TAG_FONT; g.fillText(num, bx + pad, by + h / 2 + big * 0.04);
  if (wTxt) {
    g.font = '650 ' + sm + 'px ' + TAG_FONT;

    const y2 = by + h * 0.7;
    g.fillText(l1, tx, by + h * 0.3); g.fillText(l2, tx, y2);

      const x2 = tx + g.measureText(l2).width; g.fillText(' | ', x2, y2);
      const gx = x2 + wSep;
      if (gp.lvl) { g.fillStyle = GAP_COL[gp.lvl]; g.beginPath(); if (g.roundRect) g.roundRect(gx - sm * 0.3, y2 - sm * 0.8, wGt, sm * 1.6, 4); else g.rect(gx - sm * 0.3, y2 - sm * 0.8, wGt, sm * 1.6); g.fill(); g.fillStyle = gp.lvl === 2 ? '#fff' : '#2b2300'; }
      g.fillText(gt, gx, y2);
    }
  }

    g.font = '600 ' + sm + 'px ' + TAG_FONT; g.textBaseline = 'top';
    const tw = g.measureText(o.dbg).width + 8;
    g.fillStyle = 'rgba(0,0,0,.72)'; g.fillRect(bx, by + h + 1, tw, sm + 5);
    g.fillStyle = '#b8f5c8'; g.fillText(o.dbg, bx + 4, by + h + 3);

}

/* =====================  Высокие нарушения  =====================
 * Отдельная необязательная система: 2 линии-ворот, скорость = расстояние ÷ время между ними.
 * Срабатывает только если скорость не меньше «лимит + превышение» (превышение — не меньше CONFIG.viol.minOver). Медленнее — игнор, без записи.
 * Над машиной на экране эта система ничего не рисует: результат — фото (кадр + вырез машины), скорость, время, расстояние — во вкладке «Нарушители» нижнего меню.
 * Источники записи: ворота (D÷t) и основная система (итоговая скорость проезда). Один трек основной системы = одна запись.
 * Тип ТС: берётся из класса рамки детектора (COCO: car / motorcycle / bus / truck), голосованием по кадрам трека. Модель детектора не менялась.
 * ANPR/OCR: отдельный модуль (Tesseract.js, грузится по требованию) — не влияет на замер и нарушения, работает только по сохранённому фото.
 */
const VIOL_COL = '#ff7a59';
const VCLS_RU = ['Легковой', 'Мотоцикл', 'Автобус', 'Грузовой'], VCLS_ICON = ['🚗', '🏍', '🚌', '🚚'];
const vcName = c => (c != null && VCLS_RU[c]) || '—';
const vcCode = n => (n === 'car' ? 0 : n === 'motorcycle' ? 1 : n === 'bus' ? 2 : n === 'truck' ? 3 : -1);
const violSrcName = s => (s === 'both' ? 'ворота + основная' : s === 'main' ? 'основная' : 'ворота');
const violThr = () => S.limit + clamp(Math.round(S.viol.over) || 0, CONFIG.viol.minOver, CONFIG.viol.maxOver);
const violSuffix = () => (S.viol.on ? ' · 🚨 ' + S.vlist.length : '');

/* ---------- Тип ТС: голосование по рамкам детектора, попавшим на блоб трека ---------- */
function vcVote(t) {
  const M = R.vc || (R.vc = new Map());

    const b = tr.blob; if (!b || b.detC == null || tr.tLast !== t) continue;
    let v = M.get(tr.id);
    if (!v) { v = { n: [0, 0, 0, 0], last: null }; M.set(tr.id, v); if (M.size > 600) M.delete(M.keys().next().value); }

/* ---------- Расстояние между воротами нарушений (мастер) ---------- */
function violAutoDists() {   // по калибровке каждой полосы, на опорной колонке; null — калибровки нет или ворота вне зоны
  const asp = gateAsp(), vr = gateVr(S.viol.gates, asp), out = [];

    const c = S.calibs[li];

}
function violZoneOk() { const a = violAutoDists(); return a.length > 0 && a.every(d => d != null); }
function violDist() {   // одно число для подписи и проверок: вручную — введённое, по калибровке — минимум по полосам

function violLbl(i) { const D = violDist(); return 'Н' + (i + 1) + (i === 1 && D != null && isFinite(D) ? ' · ' + fmt(D, D % 1 ? 1 : 0) + ' м' : ''); }

  const g = S.viol.gates, asp = aw / ah;

/* ---------- Монитор ворот: пересечение линий нижней кромкой трека, интерполяция момента между кадрами ---------- */
class FastGates {
  constructor(o) { this.aw = o.aw; this.ah = o.ah; this.L = o.lines; this.trk = o.trk; this.mode = o.mode; this.distM = o.distM; this.C = o.cfg; this.thr = o.thr; this.st = new Map(); this.ev = []; }
  yAt(i, x) { const L = this.L[i]; return this.ah * (L.v + L.ks * (x / this.aw - L.a)); }
  _s(p, li) {   // метры вдоль дороги по калибровке полосы li; NaN — точка вне зоны калибровки
    const c = calAt(this.trk.cals, li), v = this.trk._v(p.x, p.y, li);

  update(tracks, t) {
    const out = [], C = this.C;
    for (const tr of tracks) {
      const bl = tr.blob;
      if (tr.dup || !bl || tr.tLast !== t || !bl.usable || bl.touching) continue;   // точка берётся только при надёжной нижней кромке
      let st = this.st.get(tr.id);
      if (!st) { st = { p: null, c: [null, null], trail: [], done: false, seen: t }; this.st.set(tr.id, st); }

    // обрыв трека между воротами и новый ID: пересечения двух разных треков одной полосы и направления, в правильном порядке, с правдоподобной скоростью

      const T = e.t - f.t;
      if (T < C.minT || (e.y - f.y) * e.dir <= 0) continue;                  // вторая линия — после первой и дальше по ходу движения
      if (Math.abs(e.u - f.u) > 0.3) continue;                                 // та же линия движения внутри полосы
      const D = this.mode === 'manual' ? this.distM : Math.abs(this._s(e, li) - this._s(f, li));
      if (!(D >= C.minDistM)) continue;
      const kmh = D / T * 3.6;
      if (!(kmh <= C.maxSpeedKmh) || kmh < 0.9 * thr) continue;                // связываем только то, что похоже на нарушение
      const dd = Math.abs(e.u - f.u);
      if (!best || dd < best.dd) best = { f, T, D, kmh, dd };
    }
    if (!best) return null;

    if (!(kmh <= C.maxSpeedKmh)) return null;
    a.used = b.used = true;
    return { id: tr.id, ids: [tr.id], link: false, lane: tr.lane, dir: a.dir > 0 ? -1 : 1, t0, t1, T, D, kmh, dMode: this.mode === 'manual' ? 'manual' : 'calib', tr };   // dir как у проездов: −1 к камере

/* ---------- Фото: кадр целиком + вырез машины в родном разрешении; подпись с данными — внизу, не поверх машины ---------- */
function violGrab(b) {
  try {
    const vw = video.videoWidth, vh = video.videoHeight; if (!vw || !vh || !R.geo) return null;
    const C = CONFIG.viol, k = Math.min(1, C.snapMaxSide / Math.max(vw, vh)), w = Math.round(vw * k), h = Math.round(vh * k);
    const full = document.createElement('canvas'); full.width = w; full.height = h;

    let crop = null;

      const pv = R.geo.pivot, q = [warpFwd(R.p, pv, b.x0, b.y0), warpFwd(R.p, pv, b.x1 + 1, b.y0), warpFwd(R.p, pv, b.x0, b.y1 + 1), warpFwd(R.p, pv, b.x1 + 1, b.y1 + 1)];

}

const violHasId = (r, ids) => ids.some(id => r.trackId === id || (r.trackIds && r.trackIds.includes(id)));
function violFromGates(ev) {
  if (!S.viol.on) return;
  if (ev.kmh < violThr()) return;                        // ниже порога — игнор, ни записи, ни фото
  if (S.vlist.some(r => violHasId(r, ev.ids))) return;
  const rec = violAdd({ src: 'gates', trackId: ev.id, trackIds: ev.ids, link: ev.link, t0: ev.t0, t1: ev.t1, lane: ev.lane, laneName: laneName(ev.lane), dir: ev.dir, kmh: ev.kmh, kmhGates: ev.kmh, T: ev.T, D: ev.D, dMode: ev.dMode, vt: ev.t1, cls: vcClass(ev.id) });
  violPhoto(rec, violGrab(ev.tr.blob));
}
function violPre(t) {   // «сначала сохранить, потом посчитать»: фото очень быстрой машины делается, пока она в кадре; итог основной системы приходит позже
  if (!S.viol.on || !R.trk) return;
  const P = R.vioPre || (R.vioPre = new Map()), thr = violThr() - CONFIG.viol.preMargin;
  for (const tr of R.trk.tracks) {
    if (!tr.shown || tr.kmh == null || tr.kmh < thr || tr.pts.length < 5 || tr.dup || tr.tLast !== t) continue;
    const bl = tr.blob; if (!bl || !bl.usable || bl.touching) continue;
    const e = P.get(tr.id);
    if (e && (e.n >= 3 || bl.area < 1.6 * e.area)) continue;   // до 3 кадров на трек; новый — только если машина заметно крупнее (ближе)
    const cap = violGrab(bl); if (!cap) continue;
    P.set(tr.id, { cap, area: bl.area, n: e ? e.n + 1 : 1, t });
    if (P.size > 4) P.delete(P.keys().next().value);
  }
}
function violFromMain(ps) {
  if (!S.viol.on) return;
  const thr = violThr(), pre = R.vioPre && R.vioPre.get(ps.id);
  if (R.vioPre) R.vioPre.delete(ps.id);
  const old = S.vlist.find(r => violHasId(r, [ps.id]));
  if (old) {   // эту машину уже записали ворота: добавляем скорость основной системы для сверки
    old.kmhMain = ps.kmh;
    if (ps.kmh >= thr && old.src === 'gates') old.src = 'both';
    old.mismatch = Math.abs(old.kmhGates - ps.kmh) / Math.max(old.kmhGates, ps.kmh, 1) > 0.25;
    violRenderSoon(); return;
  }
  if (ps.kmh < thr) return;
  const rec = violAdd({ src: 'main', trackId: ps.id, trackIds: [ps.id], t0: ps.t0, t1: ps.t1, lane: ps.lane, laneName: laneName(ps.lane), dir: ps.dir, kmh: ps.kmh, kmhMain: ps.kmh, T: ps.t1 - ps.t0, D: ps.path, dMode: 'track', vt: ps.t1, cls: vcClass(ps.id) });
  if (pre) violPhoto(rec, pre.cap);
  else if (ps.snap) {   // чистого кадра нет — берём снимок основной системы (на нём плашка), копией: оригинал живёт недолго
    rec.tagged = true;
    fetch(ps.snap).then(r => r.blob()).then(bl => { if (S.vlist.includes(rec)) { rec.snap = URL.createObjectURL(bl); violRenderSoon(); } }).catch(() => { rec.noPhoto = true; });
  } else rec.noPhoto = true;
}

/* ---------- ANPR / OCR: отдельный модуль, по сохранённому фото (Tesseract.js грузится при первом запуске) ---------- */
const ANPR = { w: null, p: null, q: [], busy: false };
function anprLoadLib() {
  if (window.Tesseract) return Promise.resolve(true);
  return new Promise(res => { const s = document.createElement('script'); s.src = CONFIG.viol.tessUrl; s.onload = () => res(!!window.Tesseract); s.onerror = () => res(false); document.head.append(s); });
}
function anprWorker() {
  if (ANPR.w) return Promise.resolve(ANPR.w);
  if (!ANPR.p) ANPR.p = (async () => {
    if (!await anprLoadLib()) throw new Error('не удалось загрузить Tesseract.js — нужен интернет');
    const w = await window.Tesseract.createWorker('eng');
    await w.setParameters({ tessedit_pageseg_mode: '6' });   // без белого списка символов: с ним Tesseract обнуляет уверенность; лишнее отсекает anprNorm
    ANPR.w = w; return w;
  })().catch(e => { ANPR.p = null; throw e; });
  return ANPR.p;
}
function anprPrep(img, y0f, y1f) {   // нижняя часть кадра/выреза → увеличение (≈1000 px по ширине) → серый → растяжка по 2–98 перцентилям
  const W = img.width, H = img.height, sy0 = Math.round(H * y0f), sh = Math.max(8, Math.round(H * (y1f - y0f)));
  const k = clamp(1000 / W, 1, 4), c = document.createElement('canvas'); c.width = Math.round(W * k); c.height = Math.round(sh * k);
  const g = c.getContext('2d', { willReadFrequently: true }); g.imageSmoothingEnabled = true; g.imageSmoothingQuality = 'high';
  g.drawImage(img, 0, sy0, W, sh, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height), a = d.data, hist = new Uint32Array(256), n = c.width * c.height;
  for (let i = 0; i < a.length; i += 4) { const y = (77 * a[i] + 150 * a[i + 1] + 29 * a[i + 2]) >> 8; a[i] = a[i + 1] = a[i + 2] = y; hist[y]++; }
  let lo = 0, hi = 255, acc = 0;
  for (; lo < 255; lo++) { acc += hist[lo]; if (acc >= 0.02 * n) break; }
  acc = 0; for (; hi > 0; hi--) { acc += hist[hi]; if (acc >= 0.02 * n) break; }
  const sc = hi > lo + 8 ? 255 / (hi - lo) : 1;
  for (let i = 0; i < a.length; i += 4) { const y = clamp((a[i] - lo) * sc, 0, 255); a[i] = a[i + 1] = a[i + 2] = y; }
  g.putImageData(d, 0, 0); return c;
}
const anprNorm = s => String(s || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
function anprFix(tok) {   // формат «1–2 буквы + 1–4 цифры» (Латвия: AB-1234, A-1234): исправляем путаницу O/0, I/1, B/8, S/5, Z/2; null — не похоже
  const toL = { 0: 'O', 1: 'I', 8: 'B', 5: 'S', 2: 'Z' }, toD = { O: '0', I: '1', B: '8', S: '5', Z: '2', L: '1' };
  for (let k = 1; k <= 2; k++) {
    if (tok.length < k + 1 || tok.length > k + 4) continue;
    if (!/^[A-Z]/.test(tok)) return null;   // первая буква префикса должна быть буквой уже в исходном чтении: чисто цифровой кусок в номер не «превращаем»
    if (!/[0-9]/.test(tok.slice(k))) continue;   // хвост без единой настоящей цифры — это слово, а не номер
    const pre = tok.slice(0, k).replace(/[0-9]/g, m => toL[m] || m), suf = tok.slice(k).replace(/[A-Z]/g, m => toD[m] || m);
    if (/^[A-Z]{1,2}$/.test(pre) && /^[0-9]{1,4}$/.test(suf)) return pre + suf;
  }
  return null;
}
function anprPick(cands) {   // cands: [{ t, conf }] из разных режимов/областей → { plate, conf, lv } | null; повтор одного и того же результата в разных проходах усиливает его
  const M = new Map();
  for (const c of cands) {
    const fx = anprFix(c.t), key = fx || c.t, m = M.get(key) || { n: 0, conf: 0, lv: !!fx, mixed: /[A-Z]/.test(c.t) && /[0-9]/.test(c.t) };
    m.n++; m.conf = Math.max(m.conf, c.conf); M.set(key, m);
  }
  let best = null;
  for (const [key, m] of M) {
    const sc = m.conf + 8 * (m.n - 1) + (m.lv ? 25 : m.mixed ? 8 : -25);
    if (!best || sc > best.sc) best = { sc, key, m };
  }
  if (!best || best.m.conf < 40 || best.key.length < 4 || !(best.m.lv || best.m.mixed)) return null;
  const p = best.m.lv ? best.key.replace(/^([A-Z]{1,2})([0-9]+)$/, '$1-$2') : best.key;
  return { plate: p, conf: Math.round(best.m.conf), lv: best.m.lv };

async function anprRead(img) {   // два фрагмента (низ выреза / целиком) × три режима разбора страницы; кандидаты — строки и склейки соседних слов

    const cv = anprPrep(img, a, b);
    for (const psm of ['6', '7', '11']) {
      await w.setParameters({ tessedit_pageseg_mode: psm });
      const { data } = await w.recognize(cv);
      for (const ln of (data.lines || [])) {
        const ws = (ln.words && ln.words.length ? ln.words : [ln]).map(x => ({ t: anprNorm(x.text), conf: x.confidence || ln.confidence || 0 })).filter(x => x.t);

          if (t.length >= 4 && t.length <= 8) cands.push({ t, conf: Math.min(...part.map(x => x.conf)) });

    }
  }
  await w.setParameters({ tessedit_pageseg_mode: '6' });

}
function anprLoadImg(url) { return new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = () => rej(new Error('фото не открылось')); im.src = url; }); }

  const url = rec.crop || rec.snap; if (!url) throw new Error('нет фото');
  rec.plateState = 'run';

    const r = await anprRead(await anprLoadImg(url));

}
function anprQueue(rec) {

  ANPR.busy = true;
  (async () => {
    while (ANPR.q.length) { const r = ANPR.q.shift(); if (!S.vlist.includes(r) || r.plate) continue; try { await anprRun(r); } catch (e) { toast('OCR: ' + (r.plateErr || e), 4500); ANPR.q.length = 0; } violRenderSoon(); }

}

  const ch = $('chFps');
  const pr = S.srcKind === 'file' && video.playbackRate < 0.995 ? ' ×' + String(video.playbackRate).replace('.', ',') : '';
  ch.firstElementChild.textContent = f.src ? f.src.toFixed(0) + '/' + f.an.toFixed(0) + pr + ' L' + (R.lvl || 0) : '—';
  ch.classList.toggle('warn', low);

}

/* ==== WALK:CAMERA:BEGIN ====
 * Режим «Ходьба», часть 1: физическая модель камеры над плоской дорогой.
 * Система дороги: X вправо, Y ВНИЗ, Z вперёд вдоль дороги (правая тройка, как у камеры). Земля: Y = 0, камера в (Xc, −H, Zc).

/* ---------- детектор машин (YOLO в воркере; запасной вариант — MediaPipe в основном потоке) ---------- */
function wkDetect(t, vw, vh) {

  if (VD.st !== 'ready' || !(VD.w || VD.det)) return;
  D.iv = VD.mode === 'worker' ? 100 : Math.max(dc.everyMs, VD.ms / dc.share);
  if (now - D.last < D.iv) return;
  if (VD.mode === 'worker' && VD.w) {
    if (D.rq && now - D.rq.wall > 4000) { D.rq = null; D.fail++; }
    if (D.rq) return;
    D.last = now;
    const [bw, bh] = vdBmpSize(vw, vh), id = ++VD.id, rq = D.rq = { id, t, wall: now };
    const bo = bw < vw && !VD.noRs ? { resizeWidth: bw, resizeHeight: bh, resizeQuality: 'low' } : undefined;
    createImageBitmap(video, bo).then(
      bmp => { if (VD.w && D.rq === rq) VD.w.postMessage({ type: 'detect', id, bmp, w: bmp.width, h: bmp.height }, [bmp]); else bmp.close(); },
      () => { if (D.rq === rq) D.rq = null; VD.noRs = 1; });
  } else if (VD.det) {
    D.last = now;
    const t0 = performance.now(); let res;
    try { res = VD.det.detectForVideo(video, vdTs()); } catch (e) { return; }
    const kx = R.aw / vw, ky = R.ah / vh, boxes = [];
    for (const d of res.detections || []) {
      const b = d.boundingBox; if (!b) continue;
      const c = d.categories && d.categories[0], s = c ? c.score : 1;
      boxes.push({ x0: b.originX * kx, y0: b.originY * ky, x1: (b.originX + b.width) * kx, y1: (b.originY + b.height) * ky, c: vcCode(c && c.categoryName), s, low: s < dc.score });
    }
    VD.ms = 0.8 * VD.ms + 0.2 * (performance.now() - t0); D.n++;

  }
}
function wkOnDet(m) {   // ответ воркера на запрос режима «Ходьба» (вызывается из vdOnMsg)
  const X = WKR.run, D = X && X.det, rq = D && D.rq; if (!rq || rq.id !== m.id) return;
  D.rq = null; D.n++; D.fail = 0; VD.wErr = 0;
  const kx = R.aw / m.w, ky = R.ah / m.h, sc = CONFIG.stab.detect.score, boxes = [];
  for (const b of m.boxes) boxes.push({ x0: b[0] * kx, y0: b[1] * ky, x1: (b[0] + b[2]) * kx, y1: (b[1] + b[3]) * ky, c: b[5], s: b[4], low: b[4] < sc });
  X.detQ.push({ t: rq.t, boxes }); if (X.detQ.length > 4) X.detQ.shift();
  VD.ms = 0.8 * VD.ms + 0.2 * m.ms; D.lag = 0.8 * D.lag + 0.2 * (performance.now() - rq.wall);
}

/* ---------- проезды ---------- */

  const p = X.pos.get(ps.id); if (p) { X.ghosts.push(Object.assign({}, p, { id: ps.id, kmh: ps.kmh, until: R.tNow + 1.0 })); X.pos.delete(ps.id); }
  if (X.t0 != null && ps.t0 - X.t0 < 5) { ps.warm = true; if (ps.conf !== 'low') ps.conf = 'low'; }   // первые ~5 с: фильтры поз и дороги ещё сходятся

  if (rec && rec.trackId === ps.id) { rec.q = ps.conf === 'low' ? 'низкое' : 'ok'; rec.conf = ps.conf; rec.kmhA = ps.kmhA; rec.kmhB = ps.kmhB; }
  X.passLog.push({ warm: !!ps.warm, id: ps.id, t0: +(ps.t0 - X.t0).toFixed(2), t1: +(ps.t1 - X.t0).toFixed(2), lane: ps.lane, dir: ps.dir, kmh: +ps.kmh.toFixed(1), kmhA: +ps.kmhA.toFixed(1), kmhB: ps.kmhB != null ? +ps.kmhB.toFixed(1) : null, rel: +ps.rel.toFixed(4), path: +ps.path.toFixed(1), n: ps.n, conf: ps.conf, cls: ps.cls, self: +(X.odo.u * 3.6).toFixed(1), mode: S.walk.mode });
}

    const k = Math.min(1, CONFIG.ui.snapMaxW / Math.max(vw, vh)), w = Math.round(vw * k), h = Math.round(vh * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h;

    const sx = w / R.aw, sy = h / R.ah, big = Math.max(20, Math.round(w / 26));

/* ---------- рисование поверх видео ---------- */
function drawWalk() {
  const g = ctx; g.setTransform(DPR, 0, 0, DPR, 0, 0); g.clearRect(0, 0, SW, SH);
  const X = WKR.run; if (!X || !X.pose || !S.frozen) return;
  if (X.t0 != null && R.tNow - X.t0 < 5) { g.save(); g.font = '600 12px system-ui,sans-serif'; g.fillStyle = 'rgba(255,214,102,.95)'; g.textAlign = 'center'; g.fillText('Прогрев позы и дороги… ещё ' + Math.max(0, 5 - (R.tNow - X.t0)).toFixed(0) + ' с — идите ровно, замеры пока ориентировочные', SW / 2, 22); g.restore(); }

  const map = (x, y) => wkEisPt(V.tx + x * sx, V.ty + y * sy);
  const gp = (Xl, Zr) => { const p = Wk.project(cam, pose, Xl, pose.Zc + Zr); return p ? map(p[0] * ah + aw / 2, p[1] * ah + ah / 2) : null; };
  const lo = Math.min(...X.roadX), hi = Math.max(...X.roadX), zA = X.tk.cfg.zMin, zB = X.tk.cfg.zMax;
  // границы полос

  for (const xb of X.roadX) {
    g.beginPath(); let on = false;
    for (let Z = 3; Z <= zB + 6; Z += 2) { const q = gp(xb + kp * Z * Z * 0.5, Z); if (!q) { on = false; continue; } if (!on) { g.moveTo(q[0], q[1]); on = true; } else g.lineTo(q[0], q[1]); }

      const Zr = c1 ? k * st - pose.Zc : k * st, xl = lo - 0.5 + kp * Zr * Zr * 0.5, xr = hi + 0.5 + kp * Zr * Zr * 0.5, a = gp(xl, Zr), b = gp(xr, Zr);

  for (const gh of X.ghosts) list.push({ x: gh.x, y: gh.y, bw: gh.bw, kmh: gh.kmh, dir: gh.dir, lane: gh.lane, id: gh.id, tilde: gh.tilde, fin: true });

  list.sort((p, q) => q.y - p.y);

    drawTag(g, { W: SW, x: d[0], yDot: d[1], yTop: tp[1], kmh: it.kmh, dir: it.dir, lane: it.lane, id: it.id, tilde: it.tilde, fin: it.fin, dbg: it.dbg, kind: tagKind(it.kmh, S.limit), big }, placed);
  }
  if (S.debug) {
    const vp = Wk.vanish(cam, pose); if (vp) { const a = map(0, ah * 0 + vp[1] * ah + ah / 2), b = map(aw, vp[1] * ah + ah / 2); g.strokeStyle = 'rgba(255,80,80,.7)'; g.lineWidth = 1; g.setLineDash([6, 5]); g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke(); g.setLineDash([]); }
    g.font = '600 12px ui-monospace, Menlo, Consolas, monospace'; g.textAlign = 'left'; g.textBaseline = 'top';
    const att = X.att, L = ['ψ=' + fmt(wkDeg(pose.psi), 1) + '° θ=' + fmt(wkDeg(pose.th), 1) + '° φ=' + fmt(wkDeg(pose.ph), 1) + '°', 'Xc=' + fmt(pose.Xc, 2) + ' м · уклон ' + fmt(eng.gradePct, 1) + ' % · ψ-доб ' + fmt(wkDeg(eng.psiOff), 1) + '° · κ=' + fmt(1000 * kp, 2) + '/км', 'IMU ' + wkSrcName() + ' ' + fmt(WKS.hz, 0) + ' Гц · шаги ' + fmt(WKS.steps.out.cadence, 2) + '/с · L=' + fmt(X.odo.L, 2) + ' м', 'зрение: ' + eng.vis.n + ' подгонок, q=' + fmt(eng.vis.q, 2) + ' · детектор ' + fmt(VD.ms, 0) + ' мс, ответов ' + X.det.n, 'источники скорости: ' + Object.keys(X.odo.src).map(k => k + ' ' + X.odo.src[k]).join(' · ') + (att ? '' : ' · БЕЗ IMU')];

function wkCamTries(c) {

/* ==== WALK:STREET:BEGIN ====
